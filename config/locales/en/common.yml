en:
  # Custom date formats used with l(date, format: :…). Month/day names are
  # localized by rails-i18n; these only set the arrangement.
  date:
    formats:
      noted_long: "%B %-d, %Y"       # June 8, 2026
      noted_short: "%b %-d"          # Jun 8
      noted_short_year: "%b %-d, %Y" # Jun 8, 2026
  language:
    en: "English"
    es: "Español"
  actions:
    read_more: "Read more"
    see_less: "See less"
    edit: "Edit"
    remove: "Remove"
    sign_in: "Sign in"
    clear_all: "Clear all"
    clear_filter: "Clear filter"
    cancel: "Cancel"
    save_changes: "Save changes"
  # Shared count-nouns (the number is rendered separately in the markup)
  units:
    log:
      one: "log"
      other: "logs"
    song:
      one: "song"
      other: "songs"
    album:
      one: "album"
      other: "albums"
    track:
      one: "track"
      other: "tracks"
